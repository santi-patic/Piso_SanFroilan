name: 🚀 Despliegue SFTP a IONOS
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Obtener código de GitHub
        uses: actions/checkout@v3

      - name: 🚀 Subir archivos vía SFTP
        uses: pressidium/sftp-deploy@v1
        with:
          host: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }} # Nota: esta herramienta usa 'user' en vez de 'username'
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './'   # Lo que hay en GitHub
          remote_path: './SantiPiso'  # Lo suelta en la carpeta del usuario (/SantiGil)
