name: 🚀 Despliegue SFTP a IONOS
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Obtener código de GitHub
        uses: actions/checkout@v3

      - name: 🚀 Subir archivos vía SFTP
        uses: n-p-as/sftp-deploy-action@v1.2.4
        with:
          host: ${{ secrets.FTP_SERVER }}
          port: 22
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './' # Sube todo lo que hay en GitHub
          remote_path: './SantiPiso' # Lo suelta directamente en la carpeta del usuario (/SantiGil)
