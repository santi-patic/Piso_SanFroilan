name: 🚀 Despliegue SFTP a IONOS
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Obtener código de GitHub
        uses: actions/checkout@v4

      - name: 🚀 Subir archivos vía SFTP (Puerto 22)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "./*"
          target: "/SantiGil/SantiPiso"
