name: 🚀 Despliegue SFTP a IONOS
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Obtener código de GitHub
        uses: actions/checkout@v3

      - name: 🚀 Subir archivos vía SFTP (Puerto 22)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './*' # Sube todo lo que hay en el repo
          remote_path: '/SantiGil' # <--- OJO AQUÍ (Lee abajo)
          sftp_only: true
